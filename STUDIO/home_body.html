<script>
(function(){
  var h = document.documentElement;

  /* 通常読み込み用クローク：初回ペイント前に確定させる */
  h.classList.add('cfi-on');
  h.classList.add('cfi-boot');

  /* 保険：BODY側が動かなくても3.5秒で必ず解除（contact と同値） */
  setTimeout(function(){
    h.classList.add('cfi-boot-out');
    setTimeout(function(){
      h.classList.remove('cfi-boot','cfi-boot-out');
    }, 280);
  }, 3500);

  var OV_ID = 'cfi-ov';

  /* 戻る／進む用クローク：
     擬似要素はbfcache復元フレームでの再現が不確実なため、
     実DOM要素＋インラインスタイルで構成する */
  function cloak(){
    var el = document.getElementById(OV_ID);
    if (!el){
      el = document.createElement('div');
      el.id = OV_ID;
      el.setAttribute('aria-hidden','true');
      el.style.cssText =
        'position:fixed;inset:0;z-index:2147483640;pointer-events:none;' +
        'background:' +
          'radial-gradient(1200px 600px at 18% 0%,rgba(15,107,224,.28),transparent 62%),' +
          'radial-gradient(900px 500px at 92% 18%,rgba(0,194,168,.18),transparent 62%),' +
          '#071019;';
      el.innerHTML =
        '<div style="position:absolute;left:0;right:0;top:44%;text-align:center;' +
        'font-family:Barlow,system-ui,-apple-system,sans-serif;font-weight:700;' +
        'font-size:clamp(40px,8vw,82px);line-height:1.02;letter-spacing:.02em;' +
        'color:#a5b7c9;opacity:.9">CREATE FROM IDEAS</div>';
      (document.body || h).appendChild(el);
    }
    el.style.display = 'block';
    h.style.overflow = 'hidden';
    return el;
  }

  /* 離脱時にクロークを貼る。
     bfcache は pagehide 完了後のDOM状態を保存するため、
     戻る／進むで復元された最初の描画からクロークが見える */
  window.addEventListener('pagehide', cloak);

  window.addEventListener('pageshow', function(e){
    if (e.persisted){
      cloak();          /* 復元直後に念のため再適用 */
      location.reload();
    } else {
      /* 通常読み込み：DOMオーバーレイは使わない（CSS側が担当） */
      var el = document.getElementById(OV_ID);
      if (el) el.style.display = 'none';
      h.style.overflow = '';
    }
  });
})();
</script>
