<!-- ① 最速で html にクラス付与（インライン＝パース時に即実行） -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cfi-dev.github.io" crossorigin>

<script>
(function(){
  var h = document.documentElement;

  /* 通常読み込み用クローク：初回ペイント前に確定させる */
  h.classList.add('cfi-on');
  h.classList.add('cfi-boot');

  /* 保険：BODY側が動かなくても3.5秒で必ず解除（contact と同値） */
  setTimeout(function(){
    h.classList.add('cfi-boot-out');
    setTimeout(function(){
      h.classList.remove('cfi-boot','cfi-boot-out');
    }, 280);
  }, 3500);

  var OV_ID = 'cfi-ov';

  /* 戻る／進む用クローク：
     擬似要素はbfcache復元フレームでの再現が不確実なため、
     実DOM要素＋インラインスタイルで構成する */
  function cloak(){
    var el = document.getElementById(OV_ID);
    if (!el){
      el = document.createElement('div');
      el.id = OV_ID;
      el.setAttribute('aria-hidden','true');
      el.style.cssText =
        'position:fixed;inset:0;z-index:2147483640;pointer-events:none;' +
        'background:' +
          'radial-gradient(1200px 600px at 18% 0%,rgba(15,107,224,.28),transparent 62%),' +
          'radial-gradient(900px 500px at 92% 18%,rgba(0,194,168,.18),transparent 62%),' +
          '#071019;';
      el.innerHTML =
        '<div style="position:absolute;left:0;right:0;top:44%;text-align:center;' +
        'font-family:Barlow,system-ui,-apple-system,sans-serif;font-weight:700;' +
        'font-size:clamp(40px,8vw,82px);line-height:1.02;letter-spacing:.02em;' +
        'color:#a5b7c9;opacity:.9">CREATE FROM IDEAS</div>';
      (document.body || h).appendChild(el);
    }
    el.style.display = 'block';
    h.style.overflow = 'hidden';
    return el;
  }

  /* 離脱時にクロークを貼る。
     bfcache は pagehide 完了後のDOM状態を保存するため、
     戻る／進むで復元された最初の描画からクロークが見える */
  window.addEventListener('pagehide', cloak);

  window.addEventListener('pageshow', function(e){
    if (e.persisted){
      cloak();          /* 復元直後に念のため再適用 */
      location.reload();
    } else {
      /* 通常読み込み：DOMオーバーレイは使わない（CSS側が担当） */
      var el = document.getElementById(OV_ID);
      if (el) el.style.display = 'none';
      h.style.overflow = '';
    }
  });
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cfi-dev.github.io/homepage_STUDIO_assets/common.css">

<style>
/* ============================================================
   1. 土台（クラス付与前でも白フラッシュしないよう html に直指定）
      ※ scroll-behavior / scroll-padding-top / a.is-todo /
        html.cfi-fallback .rv は common.css を唯一の正とし、
        ここでは再定義しない
   ============================================================ */
html{background:#071019}
html.cfi-on{
  /* STUDIO内部変数の上書き（ローディング地色 #e5e5e5 を打ち消す） */
  --rebranding-loading-bg:#071019;
  --rebranding-loading-bar:#00c2a8;
}
html.cfi-on body{margin:0;padding:0;background:#071019;height:auto;
  overflow-x:hidden;overflow-y:visible;position:static;display:block}

/* トップはSTUDIOキャンバスを使わないため、確実に伏せる */
html.cfi-on #__nuxt{display:none !important}

/* ============================================================
   2. 起動クローク（通常読み込み時／FOUC・白フラッシュ防止）
      ※ contact 側と数値・演出を必ず一致させること
   ============================================================ */
html.cfi-boot{overflow:hidden}
html.cfi-boot #__nuxt,
html.cfi-boot #teleports,
html.cfi-boot #cfi-root{visibility:hidden !important}

html.cfi-boot body::before{
  content:"";
  position:fixed;inset:0;z-index:2147483600;pointer-events:none;
  background:
    radial-gradient(1200px 600px at 18% 0%,  rgba(15,107,224,.28), transparent 62%),
    radial-gradient(900px 500px  at 92% 18%, rgba(0,194,168,.18), transparent 62%),
    #071019;
  opacity:1;transition:opacity .28s ease
}
html.cfi-boot body::after{
  content:"CREATE FROM IDEAS";
  position:fixed;left:0;right:0;top:44%;z-index:2147483601;pointer-events:none;
  text-align:center;
  font-family:"Barlow",system-ui,-apple-system,sans-serif;font-weight:700;
  font-size:clamp(40px,8vw,82px);line-height:1.02;letter-spacing:.02em;
  color:#a5b7c9;opacity:.9;transition:opacity .28s ease
}
html.cfi-boot.cfi-boot-out body::before,
html.cfi-boot.cfi-boot-out body::after{opacity:0}
@media (prefers-reduced-motion:reduce){
  html.cfi-boot body::before,html.cfi-boot body::after{transition:none}
}
</style>
