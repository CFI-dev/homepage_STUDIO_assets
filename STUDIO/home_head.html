<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cfi-dev.github.io" crossorigin>

<script>
/* クロークは廃止。cfi-on の付与のみ行う（描画前に確定させる） */
document.documentElement.classList.add('cfi-on');
</script>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cfi-dev.github.io/homepage_STUDIO_assets/common.css?v=20260827r1">

<style>
/* ============================================================
   CFI CORPORATE / STUDIO CUSTOM CODE [HEAD]  rev: 2026-08-27r4
   ------------------------------------------------------------
   r3 からの変更点
     - 起動クローク（旧2章）を全廃
       ・body::before / body::after のオーバーレイを削除
       ・cfi-boot / cfi-boot-out 関連定義を削除
       ・pagehide / pageshow による bfcache 制御を削除
       ・実DOMオーバーレイ #cfi-ov の生成処理を削除
     - 白フラッシュ防止は html への地色直指定（1章）で担保
     - 章番号を繰り上げ（旧3〜5章 → 2〜4章）
   ============================================================ */

/* ============================================================
   1. 土台（クラス付与前でも白フラッシュしないよう html に直指定）
   ============================================================ */
html{background:#071019}
html.cfi-on{
  background:#071019;
  scroll-behavior:smooth;
  scroll-padding-top:var(--hd,72px);
  /* STUDIO内部変数の上書き（ローディング地色 #e5e5e5 を打ち消す） */
  --rebranding-loading-bg:#071019;
  --rebranding-loading-bar:#00c2a8;
}
html.cfi-on body{margin:0;padding:0;background:#071019;height:auto;
  overflow-x:hidden;overflow-y:visible;position:static;display:block}

/* トップはSTUDIOキャンバスを使わないため、確実に伏せる */
html.cfi-on #__nuxt{display:none !important}

/* 起動中のSTUDIO側 transition:all（.3s〜.4s）を抑止
   （クローク廃止によりチラつきが出る場合の保険） */
html.cfi-on .StudioCanvas,
html.cfi-on .render-canvas *{transition:none !important}

/* リビール演出が発火しなかった場合の保険（common.css 側に定義が無い） */
html.cfi-fallback .rv{opacity:1;transform:none}

/* ============================================================
   2. ロゴ実寸（common.css には height 指定が無いため必須）
      ※ contact 側と数値を必ず一致させること
   ============================================================ */
html.cfi-on .logo{display:flex;align-items:center;gap:10px}
html.cfi-on .logo .mark{height:32px;width:auto;flex:0 0 auto;object-fit:contain}
html.cfi-on .logo .logo-name{height:34px;width:auto;flex:0 0 auto;object-fit:contain;display:block}
html.cfi-on footer .logo .logo-name{height:31px}
@media (max-width:360px){
  html.cfi-on .logo{gap:8px}
  html.cfi-on .logo .mark{height:26px}
  html.cfi-on .logo .logo-name{height:27px}
}

/* ============================================================
   3. 未確定リンク（data-cfi-todo）の可視化
      URLが決まったら data-cfi-todo を削除し href を設定する
   ============================================================ */
html.cfi-on a.is-todo{opacity:.5;cursor:not-allowed;pointer-events:none}
html.cfi-on a.is-todo::after{
  content:" (URL未設定)";font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em}
html.cfi-on .is-todo-text{color:#ffb4a2}

/* ============================================================
   4. アンカー位置の微調整（固定ヘッダー分）
   ============================================================ */
html.cfi-on #cta{scroll-margin-top:var(--hd,72px)}
</style>
